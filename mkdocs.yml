site_name: Cuadratura Gaussiana
theme: 
  name: material

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  - pymdownx.arithmatex:
    generic: true

extra_jacascript:
  - javascripts/mathjax.js
  - https:unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nax:
  - Inicio: index.md
  - Explicación: explanaition.md
  - Tutorial: tutorials.md
  - Referencia: reference.md
